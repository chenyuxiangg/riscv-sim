<text x="1164" y="894" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Helvetica Neue,sans-serif" font-size="11.0" font-weight="400" fill="#243043" text-anchor="start" opacity="1">反向代理 + TLS + 来源限流</text>
<text x="1164" y="912" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Helvetica Neue,sans-serif" font-size="11.0" font-weight="400" fill="#4a5666" text-anchor="start" opacity="1">SQLite：板 / 工程状态持久化</text>
