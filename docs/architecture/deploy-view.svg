<text x="1258" y="796" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Helvetica Neue,sans-serif" font-size="11.0" font-weight="400" fill="#243043" text-anchor="start" opacity="1">schema v19 · Message 信封</text>
<rect x="470" y="850" width="320" height="88" rx="10" ry="10" fill="#f6f8fb" stroke="#cdd5e0" stroke-width="1.4" opacity="1"/>
<text x="484" y="874" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Helvetica Neue,sans-serif" font-size="13" font-weight="600" fill="#1c2430" text-anchor="start" opacity="1">HEALTHCHECK（镜像自带）</text>
<text x="484" y="894" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Helvetica Neue,sans-serif" font-size="11.0" font-weight="400" fill="#243043" text-anchor="start" opacity="1">每 30s：curl /healthz</text>
<text x="484" y="912" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Helvetica Neue,sans-serif" font-size="11.0" font-weight="400" fill="#4a5666" text-anchor="start" opacity="1">3 次失败 ⇒ unhealthy（deploy.sh 会打印日志）</text>
<rect x="810" y="850" width="320" height="88" rx="10" ry="10" fill="#f6f8fb" stroke="#cdd5e0" stroke-width="1.4" opacity="1"/>
<text x="824" y="874" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Helvetica Neue,sans-serif" font-size="13" font-weight="600" fill="#1c2430" text-anchor="start" opacity="1">卷 sim-data → /data</text>
<text x="824" y="894" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Helvetica Neue,sans-serif" font-size="11.0" font-weight="400" fill="#243043" text-anchor="start" opacity="1">/data/images = --allow-image-root（白名单根）</text>
<text x="824" y="912" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Helvetica Neue,sans-serif" font-size="11.0" font-weight="400" fill="#4a5666" text-anchor="start" opacity="1">重启容器后仍在；数据卷不随 down 删除</text>
<rect x="1150" y="850" width="350" height="88" rx="10" ry="10" fill="#fbfbfc" stroke="#c8ced8" stroke-width="1.4" stroke-dasharray="6 4" opacity="1"/>
