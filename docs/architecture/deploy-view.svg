<text x="506" y="796" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Helvetica Neue,sans-serif" font-size="11.0" font-weight="400" fill="#243043" text-anchor="start" opacity="1">index.html · app.js · services/* · views/* · style.css</text>
<rect x="986" y="582" width="492" height="150" rx="10" ry="10" fill="#ffffff" stroke="#c3cedb" stroke-width="1.4" opacity="1"/>
<text x="1000" y="606" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Helvetica Neue,sans-serif" font-size="13" font-weight="600" fill="#1c2430" text-anchor="start" opacity="1">会话线程池（每会话一线程）</text>
<text x="1000" y="626" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Helvetica Neue,sans-serif" font-size="11.0" font-weight="400" fill="#243043" text-anchor="start" opacity="1">KernelHost 不是 Send ⇒ 靠线程边界隔离</text>
<text x="1000" y="644" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Helvetica Neue,sans-serif" font-size="11.0" font-weight="400" fill="#4a5666" text-anchor="start" opacity="1">同一时刻一个推进者；忙 ⇒ 409 E_SESS-02</text>
<text x="1000" y="662" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Helvetica Neue,sans-serif" font-size="11.0" font-weight="400" fill="#4a5666" text-anchor="start" opacity="1">作业：Job::Debug（REST） / Job::Contract（…/command）</text>
<text x="1000" y="680" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Helvetica Neue,sans-serif" font-size="11.0" font-weight="400" fill="#4a5666" text-anchor="start" opacity="1">事件环 + console 环（绝对 offset）</text>
<rect x="986" y="752" width="234" height="60" rx="10" ry="10" fill="#eefaf1" stroke="#a8d3b6" stroke-width="1.4" opacity="1"/>
<text x="1000" y="776" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Helvetica Neue,sans-serif" font-size="13" font-weight="600" fill="#1c2430" text-anchor="start" opacity="1">内核 riscv_sim_kernel</text>
<text x="1000" y="796" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Helvetica Neue,sans-serif" font-size="11.0" font-weight="400" fill="#243043" text-anchor="start" opacity="1">native · 同一 crate</text>
