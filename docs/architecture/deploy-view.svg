<text x="484" y="194" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Helvetica Neue,sans-serif" font-size="13" font-weight="600" fill="#1c2430" text-anchor="start" opacity="1">部署入口</text>
<text x="484" y="214" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" font-weight="400" fill="#243043" text-anchor="start" opacity="1">./deploy.sh            (up，带缓存)</text>
<text x="484" y="232" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Helvetica Neue,sans-serif" font-size="11.5" font-weight="400" fill="#4a5666" text-anchor="start" opacity="1">./deploy.sh rebuild    (--no-cache)</text>
<text x="484" y="250" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Helvetica Neue,sans-serif" font-size="11.5" font-weight="400" fill="#4a5666" text-anchor="start" opacity="1">.env：SIM_TOKEN（随机，chmod 600）</text>
<text x="484" y="268" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Helvetica Neue,sans-serif" font-size="11.5" font-weight="400" fill="#4a5666" text-anchor="start" opacity="1">SIM_HOST_PORT=8876 · SIM_BOARD=qemu-virt</text>
<rect x="830" y="170" width="300" height="140" rx="10" ry="10" fill="#fff7e8" stroke="#e8c98a" stroke-width="1.4" opacity="1"/>
<text x="844" y="194" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Helvetica Neue,sans-serif" font-size="13" font-weight="600" fill="#1c2430" text-anchor="start" opacity="1">镜像（本地 tag + 已发布）</text>
<text x="844" y="214" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Helvetica Neue,sans-serif" font-size="11.2" font-weight="400" fill="#243043" text-anchor="start" opacity="1">riscv-sim-server:latest（本机构建）</text>
<text x="844" y="232" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Helvetica Neue,sans-serif" font-size="11.2" font-weight="400" fill="#4a5666" text-anchor="start" opacity="1">ACR: …/zyzs/riscv_sim · v0.1.0 / sha-*</text>
<text x="844" y="250" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Helvetica Neue,sans-serif" font-size="11.2" font-weight="400" fill="#4a5666" text-anchor="start" opacity="1">rust:1-bookworm → debian:bookworm-slim</text>
<text x="844" y="268" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Helvetica Neue,sans-serif" font-size="11.2" font-weight="400" fill="#4a5666" text-anchor="start" opacity="1">只装 ca-certificates + curl · amd64 36MB</text>
<text x="844" y="286" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Helvetica Neue,sans-serif" font-size="11.2" font-weight="400" fill="#4a5666" text-anchor="start" opacity="1">本机无 Docker 引擎 ⇒ 未本机构建；由 CI 构建</text>
<rect x="1160" y="170" width="340" height="140" rx="10" ry="10" fill="#fdeeee" stroke="#e3adad" stroke-width="1.4" opacity="1"/>
<text x="1174" y="194" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Helvetica Neue,sans-serif" font-size="13" font-weight="600" fill="#1c2430" text-anchor="start" opacity="1">端口映射（compose 发布）</text>
<text x="1174" y="214" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Helvetica Neue,sans-serif" font-size="11.2" font-weight="400" fill="#243043" text-anchor="start" opacity="1">宿主机 8876  →  容器 9876</text>
<text x="1174" y="232" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Helvetica Neue,sans-serif" font-size="11.2" font-weight="400" fill="#4a5666" text-anchor="start" opacity="1">默认发布在所有网卡（0.0.0.0:8876）</text>
<text x="1174" y="250" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Helvetica Neue,sans-serif" font-size="11.2" font-weight="400" fill="#4a5666" text-anchor="start" opacity="1">⚠ 谁能访问 8876 就等于谁能执行内核</text>
<rect x="470" y="360" width="1030" height="470" rx="10" ry="10" fill="#ffffff" stroke="#7c8ea6" stroke-width="1.8" opacity="1"/>
