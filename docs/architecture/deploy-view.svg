<rect x="492" y="404" width="986" height="78" rx="10" ry="10" fill="#f6f8fb" stroke="#cdd5e0" stroke-width="1.4" opacity="1"/>
<text x="506" y="428" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Helvetica Neue,sans-serif" font-size="13" font-weight="600" fill="#1c2430" text-anchor="start" opacity="1">docker/entrypoint.sh</text>
<text x="506" y="448" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Helvetica Neue,sans-serif" font-size="11.5" font-weight="400" fill="#243043" text-anchor="start" opacity="1">env → argv：SIM_TOKEN 必填（否则拒绝启动）；set -- 逐个追加，不做字符串拼接</text>
<rect x="492" y="500" width="986" height="62" rx="10" ry="10" fill="#eef3f9" stroke="#a9b9cd" stroke-width="1.4" opacity="1"/>
<text x="506" y="524" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Helvetica Neue,sans-serif" font-size="13" font-weight="600" fill="#1c2430" text-anchor="start" opacity="1">进程 riscv_sim_server（唯一宿主）</text>
<text x="506" y="544" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Helvetica Neue,sans-serif" font-size="11.2" font-weight="400" fill="#243043" text-anchor="start" opacity="1">--bind 0.0.0.0 --port 9876 --allow-remote --token *** --front-dir /app/front</text>
<rect x="492" y="582" width="470" height="150" rx="10" ry="10" fill="#ffffff" stroke="#c3cedb" stroke-width="1.4" opacity="1"/>
<text x="506" y="606" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Helvetica Neue,sans-serif" font-size="13" font-weight="600" fill="#1c2430" text-anchor="start" opacity="1">HTTP 面（同一端口）</text>
<text x="506" y="626" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Helvetica Neue,sans-serif" font-size="11.0" font-weight="400" fill="#243043" text-anchor="start" opacity="1">GET /&lt;路径&gt;  静态资源 · Cache-Control: no-store</text>
<text x="506" y="644" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Helvetica Neue,sans-serif" font-size="11.0" font-weight="400" fill="#4a5666" text-anchor="start" opacity="1">GET /healthz  公开（探针用，不校验令牌）</text>
<text x="506" y="662" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Helvetica Neue,sans-serif" font-size="11.0" font-weight="400" fill="#4a5666" text-anchor="start" opacity="1">/api/**  require_token：只认 x-auth-token</text>
<text x="506" y="680" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Helvetica Neue,sans-serif" font-size="11.0" font-weight="400" fill="#4a5666" text-anchor="start" opacity="1">  唯一例外：…/events/ws 升级可带 ?token=</text>
<text x="506" y="698" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Helvetica Neue,sans-serif" font-size="11.0" font-weight="400" fill="#4a5666" text-anchor="start" opacity="1">  （浏览器 WebSocket 不能带自定义头）</text>
<rect x="492" y="752" width="470" height="60" rx="10" ry="10" fill="#ffffff" stroke="#c3cedb" stroke-width="1.4" opacity="1"/>
