<text x="74" y="212" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Helvetica Neue,sans-serif" font-size="11.5" font-weight="400" fill="#4a5666" text-anchor="start" opacity="1">GET / · /app.js · /services/*</text>
