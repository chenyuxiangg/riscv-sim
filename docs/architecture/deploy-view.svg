<text x="60" y="360" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Helvetica Neue,sans-serif" font-size="12.5" font-weight="700" fill="#1c2430" text-anchor="start" opacity="1">读法</text>
<text x="60" y="384" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Helvetica Neue,sans-serif" font-size="11.5" font-weight="400" fill="#5a6878" text-anchor="start" opacity="1">1. 浏览器只认一个地址：http://host:8876/?token=…</text>
<text x="60" y="404" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Helvetica Neue,sans-serif" font-size="11.5" font-weight="400" fill="#5a6878" text-anchor="start" opacity="1">2. 服务端把页面与 API 一起回 → 同源，无 CORS、无第二个进程</text>
