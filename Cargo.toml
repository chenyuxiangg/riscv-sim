[workspace]
resolver = "2"
members = [
    "crates/contract",
    "crates/kernel",
    "crates/server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
authors = ["RISC-V Sim Platform Contributors"]
repository = "https://example.invalid/riscv_sim"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[profile.dev]
opt-level = 0
debug = true
incremental = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
panic = "abort"

[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
