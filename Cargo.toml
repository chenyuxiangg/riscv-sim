[workspace]
resolver = "2"
members = [
    "crates/contract",
    "crates/kernel",
    "crates/server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
authors = ["RISC-V Sim Platform Contributors"]
repository = "https://example.invalid/riscv_sim"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
# M-0 contract doc gap is intentional (PROGRESS.md §7, 2026-10-19 决策记录):
# tighten back to "deny" once every public variant / field is documented.
missing_docs = "allow"

[workspace.lints.clippy]
# M-0 protocol code was written before clippy::derivable_impls was active
# at the project level. Don't churn the frozen schemas just to silence a
# stylistic warning — revisit when M-0 contracts are re-shaped post-MVP.
derivable_impls = "allow"
# M-12's BinaryHeap min-heap trick relies on a non-canonical Ord impl
# (PROGRESS.md §1.2 M-12 状态: 调度器骨架). Re-enable when M-12 finishes
# the ISS-instruction-budget wiring and the queue grows a real comparator.
non_canonical_partial_ord_impl = "allow"

[profile.dev]
opt-level = 0
debug = true
incremental = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
panic = "abort"

[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
