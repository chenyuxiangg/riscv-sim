<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>RISC-V Sim · 工作台 (MVP)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <span class="brand">RISC-V Sim</span>
    <nav id="workbench-tabs" class="tabs">
      <a href="#/product"  class="tab" data-view-tab="product">产品</a>
      <a href="#/embedded" class="tab" data-view-tab="embedded">嵌入式</a>
      <a href="#/debug"    class="tab" data-view-tab="debug">调试</a>
      <a href="#/waveform" class="tab" data-view-tab="waveform">波形</a>
      <a href="#/terminal" class="tab" data-view-tab="terminal">终端</a>
      <a href="#/regmem"   class="tab" data-view-tab="regmem">寄存器/内存</a>
    </nav>
    <button id="seed-demo" class="seed-btn" type="button" title="MVP dev-only">seed demo 映射</button>
    <span class="status" id="status">未连接</span>
  </header>

  <main id="app"></main>

  <footer class="footer">
    MVP 第一刀：M-14 总线 + M-01/02/03 工作台（M1 数据底座 4 人日）。
    <code>M-13 ↔ M-14</code> ADDI 集成测试通过；kernel 编译为 WASM 后此页面会接 M-07 transport。
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
