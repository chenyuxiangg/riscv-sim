<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>RISC-V Sim · 工作台</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <span class="brand">RISC-V Sim</span>
    <nav id="workbench-tabs" class="tabs">
      <a href="#/product"  class="tab" data-view-tab="product">产品</a>
      <a href="#/embedded" class="tab" data-view-tab="embedded">嵌入式</a>
      <a href="#/debug"    class="tab" data-view-tab="debug">调试</a>
      <a href="#/waveform" class="tab" data-view-tab="waveform">波形</a>
      <a href="#/terminal" class="tab" data-view-tab="terminal">终端</a>
      <a href="#/regmem"   class="tab" data-view-tab="regmem">寄存器/内存</a>
    </nav>
    <button id="seed-demo" class="seed-btn" type="button" title="MVP dev-only">seed demo 映射</button>
    <span class="status" id="status">未连接</span>
  </header>

  <main id="app"></main>

  <footer class="footer">
    RISC-V 仿真 / 调试工作台 · 零构建前端（原生 ES modules，无打包步骤）。
    需通过 HTTP 打开：<code>python3 -m http.server 8080 --directory front</code>
    <span class="muted">（ES module 与 Worker 均要求同源，<code>file://</code> 直开会被浏览器拦截）</span>
    <span id="build-info"></span>
  </footer>

  <script>
    // ES modules need a same-origin HTTP(S) origin — a `file://` page is
    // blocked by the browser's CORS rules and would show a blank page with
    // no explanation. This inline classic script still runs when the
    // module script is blocked, so the failure is spelled out
    // (FRONTEND_Review.md #13).
    if (location.protocol === "file:") {
      document.getElementById("status").textContent =
        "请通过 HTTP 打开：python3 -m http.server 8080 --directory front";
    }
  </script>

  <script type="module" src="app.js"></script>
</body>
</html>
