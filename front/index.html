<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>RISC-V Sim · 工作台</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <!--
      ⚠️ **窄屏抽屉的开关**（STAGE-34 · v0.49 批）：宽屏侧边栏**常驻**，
      窄屏（< 720px）侧边栏变抽屉 ⇒ ⇒ 这个按钮**窄屏才出现**。
    -->
    <button class="burger" data-sidebar-toggle type="button" aria-label="打开导航">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>

    <div class="brand">RISC-V Sim</div>

    <!--
      ⚠️ **连接状态胶囊**（STAGE-34 · v0.49 批）。

      ⚠️ **它里面装的就是 `#status` 那个元素** ⇒ ⇒ 连接状态**只有一处文案**
      （`app.js` 的 `describeTransport()`）⇒ ⇒ **不是第二个真相**。
      ⚠️ 那个 `.dot` 的颜色由 `app.js` 按 `transport.connected` 切
      （`.conn` / `.conn.is-offline`）⇒ ⇒ 状态**看得见**，不是只读一行字。
    -->
    <div class="conn" data-kernel-conn>
      <span class="dot"></span>
      <!--
        ⚠️ **初值是「启动中…」而不是「未连接」**（v0.63 批）⇒ ⇒ 「未连接」是
        **内核没连上**的话术 ⇒ ⇒ 而「**脚本根本没启动**」时页面也停在初值
        ⇒ ⇒ 两者**长得一模一样** ⇒ ⇒ 用户会以为是内核的问题 ⇒ ⇒ 那个真机
        事故（缓存导致 ES module 链接失败 ⇒ ⇒ 整个 app.js 都不执行）就是这么
        被误读的 ⇒ ⇒ 初值改成「启动中…」⇒ ⇒ 两种情况**一眼能分开**。
      -->
      <span class="status" id="status">启动中…</span>
    </div>

    <!--
      ⚠️ **页头的「加载固件」入口**（STAGE-33 · v0.48 批）。

      控件本体由 `views/components/image-loader.js` 的
      `renderImageLoaderControl()` 渲染（app 层挂进来）⇒ ⇒ `accept` 列表与
      按钮文案**只有一处**⇒ ⇒ **不写第二套**。

      ⚠️ **为什么放在页头、且在品牌名右边**：默认落地视图是 `embedded`（不是
      `product`）⇒ ⇒ 放在产品视图里用户**根本找不到** ⇒ ⇒ 页头是**任何视图
      都在**的地方；而放在品牌名右边 ⇒ ⇒ **第一行最显眼处** ⇒ ⇒ 标签页
      换行也不会把它挤下去。

      ⚠️ **v0.58 批：这是**唯一**那个加载入口**（产品视图里那个重复的入口
      撤掉了 ⇒ ⇒ 用户定案「只应该有一个入口」）⇒ ⇒ 装载结果**就在按钮
      旁边**看得见（页头那条短状态条）⇒ ⇒ 产品视图里那块降级成**纯状态
      显示**（当前固件是什么 / 上次装载成没成）。

      ⚠️ **它带 `data-image-load-from` 位置标记** ⇒ ⇒ 真机门禁按**位置**
      取元素 ⇒ ⇒ 选择器**无歧义**（这个标记的取值**只写在一处**：共享组件
      里的 `IMAGE_ENTRY_FROM`）。

      ⚠️ **STAGE-34 批不动它的形态**（裁决 F）⇒ ⇒ STAGE-33 的
      B-6 ~ B-11 **一字不改**仍然成立。
    -->
    <span class="image-loader-slot" data-image-load-slot></span>

    <!--
      ⚠️ **全局运行条**（STAGE-34 · v0.49 批）：PC + 虚拟时间 + 运行 / 单步 / 复位。
      ⇒ ⇒ 按钮**由 app 层接线**（`wireTopbarRunbar`）⇒ ⇒ 它们**直接调
      `handleCommand`** ⇒ ⇒ 与调试视图那份**共用同一条命令路径**。

      ⚠️ **「暂停」按钮**（STAGE-37 · v0.52 批 · 裁决 G）：「运行」是**连续
      运行**⇒ ⇒ 必须有一个**真实出口**⇒ ⇒ 顶栏加这个按钮。
      ⚠️ **状态位**（`data-topbar-run-status`）：让「在跑」**看得见**⇒ ⇒
      文案**只有 app 层一处**⇒ ⇒ 界面上显示的与判据说看到的是同一个词。
    -->
    <div class="runbar" data-topbar-runbar>
      <span class="stat" data-topbar-pc>PC <b class="mono" data-topbar-pc-value>—</b></span>
      <span class="stat hide-m" data-topbar-time>虚拟时间 <b class="mono" data-topbar-time-value>—</b></span>
      <span class="stat hide-m" data-topbar-run-status>已停止</span>
      <!--
        ⚠️ **「运行 / 继续」是同一个动作的两种说法**（v0.63 批 · 用户拍板
        「当加载之后顶栏的运行应该显示运行，点击停之后需要切换为继续」）。
        ⇒ ⇒ 按钮的**文案由 app 层同步**（`syncTopbarRunButton` ⇒ ⇒ 判据是
        `front/lib/run-loop.js` 那个**纯函数** `runActionLabel`）⇒ ⇒ 这里的
        「运行」只是**首屏那一帧**的初值 ⇒ ⇒ 真值在 app 层那一份。
        ⇒ ⇒ **原始属性** `data-topbar-run-label` 也在 ⇒ ⇒ 门禁读它而不是
        解析中文。
      -->
      <button class="btn run" data-topbar-action="run" data-topbar-run-label="运行" type="button">运行</button>
      <button class="btn" data-topbar-action="step" type="button">单步</button>
      <button class="btn" data-topbar-action="pause" type="button">暂停</button>
      <button class="btn" data-topbar-action="reset" type="button">复位</button>
    </div>

    <button id="seed-demo" class="seed-btn" type="button" title="MVP dev-only">seed demo 映射</button>
  </header>

  <!--
    ⚠️ **告警弹窗**（STAGE-38 · v0.53 批 · 裁决 J）。

    ⚠️ **骨架住在顶层**（不在 `<main id="app">` 里面）⇒ ⇒ 视图每次重渲染
    都是 `body.innerHTML = html`（整块重建）⇒ ⇒ 弹窗放在视图正文里会被
    **销毁** ⇒ ⇒ 放在这里就**活下来**（F12）。

    ⚠️ **状态用属性表达**（`data-alert-state`：`open` / `fading` / 空）⇒ ⇒
    不依赖 `style` / `hidden` ⇒ ⇒ `front/tests/dom-stub.mjs` 测得到 ⇒ ⇒
    Node 侧零浏览器就能验「5 秒后渐隐」「知道了立即关闭」。

    ⚠️ **文案只有一处**：`front/lib/alert.js` 填它 ⇒ ⇒ 界面上显示的与
    判据说看到的是**同一个词**。
  -->
  <div class="alert-overlay" data-alert-overlay data-alert-state="">
    <div class="alert-box" role="alertdialog" aria-modal="true" aria-labelledby="alert-title">
      <h3 class="alert-title" id="alert-title" data-alert-title>提示</h3>
      <p class="alert-text" data-alert-text></p>
      <button type="button" class="btn alert-dismiss" data-alert-dismiss>知道了</button>
    </div>
  </div>

  <div class="shell">
    <!--
      ⚠️ **左侧分组导航**（STAGE-34 · v0.49 批）。

      ⚠️ **导航项由 `views/m01_workbench.js` 按 `VIEW_REGISTRY` 的 `group`
      元数据渲染**（裁决 C ⇒ ⇒ 分组**只有一个落点**）⇒ ⇒ 这里**只放空容器**
      ⇒ ⇒ 视图表改了侧边栏自动跟着改。
      ⚠️ 渲染出来的项**保留 `data-view-tab` 属性**（裁决 B）⇒ ⇒
      「当前项」仍由 `aria-current="page"` 标记 ⇒ ⇒ 旧标签页那套语义不变。
    -->
    <aside class="sidebar" data-sidebar aria-label="视图导航"></aside>

    <main class="main" id="app"></main>
  </div>

  <footer class="footer">
    RISC-V 仿真 / 调试工作台 · 零构建前端（原生 ES modules，无打包步骤）。
    需通过 HTTP 打开：<code>python3 tools/serve-front.py</code>
    <span class="muted">（ES module 与 Worker 均要求同源，<code>file://</code> 直开会被浏览器拦截）</span>
    <span id="build-info"></span>
    <span id="kernel-note" class="muted"></span>
  </footer>

  <script>
    // ES modules need a same-origin HTTP(S) origin — a `file://` page is
    // blocked by the browser's CORS rules and would show a blank page with
    // no explanation. This inline classic script still runs when the
    // module script is blocked, so the failure is spelled out
    // (FRONTEND_Review.md #13).
    if (location.protocol === "file:") {
      document.getElementById("status").textContent =
        "请通过 HTTP 打开：python3 tools/serve-front.py";
    }

    // ⚠️ **启动自检**（v0.63 批 · 「白屏要能自解释」）。
    //
    // ⚠️ **为什么要有**：ES module 的**链接期**是**全有或全无**的 ⇒ ⇒ 「新的
    //   app.js」+「**浏览器缓存里的旧**某个模块」⇒ ⇒ 只要 app.js 从旧文件里
    //   import 了一个**旧文件没有的名字**⇒ ⇒ **整个 app.js 都不执行**
    //   ⇒ ⇒ 页面**只剩这一份静态 HTML** ⇒ ⇒ 侧栏空、主区空、状态停在初值
    //   ⇒ ⇒ 用户看到的是「**一片空白 + 未连接**」，而真相是「**脚本没启动**」。
    //
    // ⚠️ **最常见的原因 = 浏览器缓存了旧版模块**（尤其：旧的
    //   `python3 -m http.server` **不发 `Cache-Control`** ⇒ ⇒ 浏览器按
    //   「启发式新鲜度」缓存 ES module ⇒ ⇒ 台账 D-169）。
    //
    // ⇒ ⇒ 所以这里**等一会儿**看状态位**还是不是初值** ⇒ ⇒ 是 ⇒ ⇒ 就**如实
    //   说**「脚本没启动」并给出**能照着做的动作**（硬刷新）⇒ ⇒ 而**不是**
    //   让用户对着一个「未连接」猜。
    window.setTimeout(function () {
      var el = document.getElementById("status");
      if (!el) return;
      if (String(el.textContent || "") !== "启动中…") return;  // 脚本跑起来了 ⇒ 不打扰
      el.textContent =
        "脚本没启动（多半是浏览器缓存了旧版模块）—— 请硬刷新：Cmd/Ctrl+Shift+R";
    }, 2500);
  </script>

  <script type="module" src="app.js"></script>
</body>
</html>
