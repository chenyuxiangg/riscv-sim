name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust · fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets -- -D warnings 2>&1 | tee /tmp/clippy.log
      - name: clippy 诊断（只在失败时）
        if: failure()
        run: |
          {
            echo "### cargo clippy 失败（前若干条按文件行号转成注解）"
            echo '```'
            grep -E '^(error|warning)' -A3 /tmp/clippy.log | head -40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # 日志要 admin 才下得动 ⇒ 把前 10 条转成 check-run 注解（公开可读）。
          grep -E '^(error|warning)' /tmp/clippy.log | head -10 | while IFS= read -r line; do
            echo "::error title=clippy::$(echo "$line" | head -c 700)"
          done
      - name: cargo test
        run: cargo test --workspace

  front:
    name: Front end · ESM link + smoke
    runs-on: ubuntu-latest
    steps:
      # ⚠️ 必须全历史：`tools/front_test_attrib.py` 的自检要 `git worktree`
      #    检出 v0.31 / v0.32 / v0.33 三个历史版本重算归属 —— 浅克隆下这些
      #    commit 不存在 ⇒ 「历史回归」直接抛 CalledProcessError（CI 红过一次）。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: front-end gate
        run: tools/check-front.sh
