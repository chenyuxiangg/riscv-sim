name: ACR prune (diagnostic)

# 只做「收敛 ACR 标签」这一件事，**不构建镜像** —— 30 秒内跑完，方便反复调。
# 触发：推一个 `acr-*` 标签（如 `acr-1`），或 Actions 页面手动 Run。
#
# 为什么要把输出推到一个分支：CI 日志要 admin/登录才看得到，而这一步的成败
# （401？405？删掉了几个？）必须被看见。日志落 `ci/acr-log` 分支的 `acr-prune.log`。

on:
  push:
    tags: ["acr-*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 跑清理（失败也继续，为了把输出留住）
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          set +e
          SHORT="$(git rev-parse --short=7 HEAD)"
          python3 tools/prune_acr_tags.py "$SHORT" > /tmp/out.txt 2>&1
          echo "exit=$?" >> /tmp/out.txt
          cat /tmp/out.txt

      - name: 把输出推到 ci/acr-log 分支
        run: |
          set -eu
          cp /tmp/out.txt acr-prune.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B ci/acr-log
          git add -f acr-prune.log
          git commit -m "chore: acr prune log (${{ github.sha }})"
          git push -f origin ci/acr-log
