name: Docker image

# 构建并推送服务端镜像到阿里云个人版 ACR。
#
# 触发：
#   - 推一个 git tag（`v*`）⇒ 顺带打上该 tag 名；
#   - Actions 页面手动 Run workflow（默认推 latest + sha）。
#
# ⚠️ 仓库要先在 ACR 控制台建好（命名空间 / 仓库名 / 公开），CI 只能往里推，不能建仓库。
#
# 需要的两个 Secrets（Settings → Secrets and variables → Actions）：
#   ACR_USERNAME  —— 阿里云账号（个人版 ACR 的用户名就是账号全名）
#   ACR_PASSWORD  —— ACR 控制台的「固定密码」（不是阿里云登录密码）
#
# ⚠️ 镜像是**公开**的：任何人不登录就能 pull。镜像里没有任何密钥 ——
#    令牌是运行时由 `.env / compose` 注入的（`.dockerignore` 也排除了 `.env`）。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      push_latest:
        description: "同时推 latest（关掉就只推 sha）"
        type: boolean
        default: true

env:
  REGISTRY: crpi-d990qy21vgojj2m7.cn-heyuan.personal.cr.aliyuncs.com
  IMAGE: crpi-d990qy21vgojj2m7.cn-heyuan.personal.cr.aliyuncs.com/zyzs/riscv_sim

jobs:
  build:
    name: build · linux/amd64 → ACR
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: 计算 tag（latest / sha / git tag）
        id: tags
        run: |
          set -eu
          short="${GITHUB_SHA::7}"
          tags="${IMAGE}:sha-${short}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tags="${tags},${IMAGE}:${GITHUB_REF_NAME}"
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ] || [ "${{ inputs.push_latest }}" != "false" ]; then
            tags="${tags},${IMAGE}:latest"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "本次推送：${tags}"

      # 预检拆成三步：日志要管理员权限才能下，但「哪个 step 红了」谁都看得见 ⇒
      # 这样能一眼分出「没配 secret」「凭据不对」「仓库不存在」三种情况，
      # 不用等 10 分钟 Rust 编译完才在 push 那一步报 NAME_UNKNOWN。
      - name: 预检 ① secrets 是否到位
        env:
          ACR_U: ${{ secrets.ACR_USERNAME }}
          ACR_P: ${{ secrets.ACR_PASSWORD }}
        run: |
          if [ -z "${ACR_U}" ] || [ -z "${ACR_P}" ]; then
            echo "::error::ACR_USERNAME / ACR_PASSWORD 至少一个为空 ⇒ 确认加在 Secrets（不是 Variables），名字大小写照抄，且没挂在某个 Environment 上"
            exit 1
          fi
          echo "secret 都在：用户名长度 ${#ACR_U}，密码长度 ${#ACR_P}"

      - name: 预检 ② 凭据换 token
        env:
          ACR_U: ${{ secrets.ACR_USERNAME }}
          ACR_P: ${{ secrets.ACR_PASSWORD }}
        run: |
          set -eu
          svc="registry.aliyuncs.com:cn-heyuan:26842"
          resp="$(curl -sf -u "${ACR_U}:${ACR_P}" --get \
              --data-urlencode "service=${svc}" \
              --data-urlencode "scope=repository:zyzs/riscv_sim:pull,push" \
              "https://dockerauth-cn-heyuan.aliyuncs.com/auth")" \
            || { echo "::error::ACR 拒了这组账号密码 ⇒ 个人版要「账号全名」+ 控制台「固定密码」，不是阿里云登录密码"; exit 1; }
          echo "${resp}" | jq -r '.access_token // .token // empty' > /tmp/acr.tok
          if [ ! -s /tmp/acr.tok ]; then echo "::error::ACR 给了 token 但内容为空"; exit 1; fi
          echo "token 长度 $(wc -c < /tmp/acr.tok)"

      - name: 预检 ③ 仓库存在且可写
        run: |
          set -eu
          code="$(curl -s -o /tmp/probe.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $(cat /tmp/acr.tok)" \
              "https://${REGISTRY}/v2/zyzs/riscv_sim/blobs/uploads/")"
          echo "仓库探针 HTTP ${code}"
          head -c 200 /tmp/probe.json || true
          if [ "${code}" != "202" ]; then
            echo "::error::仓库 zyzs/riscv_sim 不存在或不可写 ⇒ 到 ACR 控制台确认命名空间 zyzs 下有 riscv_sim 这个仓库、访问级别是公开"
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # 日志要管理员权限才下得动，所以把 build 拆成三段：红在哪一段就知道是哪一类问题。
      - name: 构建 ① 拉基础镜像（Docker Hub 限流 / 网络会在这里红）
        run: |
          set -eu
          docker pull rust:1-bookworm
          docker pull debian:bookworm-slim

      - name: 构建 ② 只编译（cargo / 编译错误会在这里红）
        run: |
          set -eu
          # 只读缓存：cache-to 统一放在 ③（整镜像）那一段，避免同一次跑里
          # 两个 exporter 抢同一个 gha 缓存键。
          docker buildx build --target build --platform linux/amd64 \
            --cache-from type=gha -o type=cacheonly .

      - name: 构建 ③ 整镜像（运行层：apt / COPY / chmod，红在这里就是 Dockerfile 问题）
        run: |
          set -eu
          docker buildx build --platform linux/amd64 \
            --cache-from type=gha --cache-to type=gha,mode=max \
            --load -t riscv-sim:probe .

      - name: 构建 ④ 打标签并推 ACR（红在这里就是 registry / 权限问题）
        run: |
          set -eu
          short="${GITHUB_SHA::7}"
          for t in "sha-${short}" "${GITHUB_REF_NAME}" latest; do
            docker tag riscv-sim:probe "${IMAGE}:${t}"
            docker push "${IMAGE}:${t}"
          done

      - name: 回读一次（确认真推上去了，而不是「构建成功但推送失败」）
        run: |
          set -eu
          first="$(echo '${{ steps.tags.outputs.tags }}' | cut -d, -f1)"
          docker buildx imagetools inspect "$first" | sed -n 1,12p
