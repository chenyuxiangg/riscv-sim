[package]
name = "riscv_sim_contract"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Shared platform contracts: data models, error codes, port signatures. All cross-module interaction flows through this crate (LLD §2.5)."

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", optional = true }

[features]
default = ["json"]
json = ["dep:serde_json"]

[lints]
workspace = true
