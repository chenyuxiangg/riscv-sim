[package]
name = "riscv_sim_server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Optional server-mode host process (P1). Wraps kernel, exposes HTTP + WebSocket transport (M-07)."

[[bin]]
name = "riscv_sim_server"
path = "src/main.rs"

[dependencies]
riscv_sim_contract = { path = "../contract" }
riscv_sim_kernel = { path = "../kernel" }
axum = { version = "0.8", features = ["ws"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "fs"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[lints]
workspace = true
