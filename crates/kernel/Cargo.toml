[package]
name = "riscv_sim_kernel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "RISC-V simulation kernel: event-driven engine, RV32IMC ISS, peripherals, observability pipeline. Compiles to native + wasm32-unknown-unknown."

[lib]
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[dependencies]
riscv_sim_contract = { path = "../contract" }
# serde_json — the WASM 协议桥 (`kernel_host::handle_json`) has to marshal
# the frozen contract envelope. It is **already** in the native dependency
# tree through the contract crate's `json` feature (the contract's own
# golden-JSON tests use it), so this adds no new external crate — it only
# makes the kernel link it directly.
serde_json = "1.0"
# M-06 ELF / Raw / HEX parser. MVP scope is RV32 ELF32 LE — a hand-rolled
# parser keeps WASM binary size and dependency surface small while still
# hitting all M-06 §3 error paths (magic / size / segment-count / overflow).
# PROGRESS.md v0.5 决策: 不引入 `object` crate，P1 阶段如需支持 ELF64 /
# non-RV32 ELF 再引入（BSD-2-Clause，无 GPL 风险）。
# object = { version = "0.36", default-features = false, features = ["read"] }

[features]
default = []
wasm = []                # Reserved for wasm-pack build entry point

# WASM export surface (D-38). Target-specific so that **native builds
# never pull `wasm-bindgen` into their dependency graph** — the
# kernel's native footprint is unchanged, and `cargo build` on a
# non-wasm target never compiles `src/wasm_api.rs`.
#
# The module itself is additionally gated on
# `#[cfg(target_arch = "wasm32")]`, so the two conditions agree.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[dev-dependencies]
# Only for the snapshot-DTO round-trip evidence (tests/m12_m17_snapshot_dto.rs):
# a DTO that cannot survive a JSON round-trip is not a persistence format.
# Dev-dependency only — it lets the *tests* use serde_json; the shipped
# artifact is unaffected. (Note: `serde` itself has been a hard dependency of
# the contract crate since long before this branch, so it was already in the
# wasm dependency graph; measured WASM cost of this branch: 0 bytes.)
serde_json = "1.0"

[lints]
workspace = true
